name: Version check

# PRs don't bump pkgver; it's raised only for a release the user asks for (0ver: 0.4.4 -> 0.4.5, minor only on request).
# Merging a raised pkgver then tags and releases it (release.yml). This only stops pkgver from going backwards.

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare pkgver with main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          base=$(git show "$BASE_SHA:packaging/PKGBUILD" | sed -n 's/^pkgver=//p')
          head=$(git show "$HEAD_SHA:packaging/PKGBUILD" | sed -n 's/^pkgver=//p')
          echo "main: $base   this PR: $head"
          if [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -1)" != "$head" ]; then
            echo "::error file=packaging/PKGBUILD::pkgver went down from $base to $head."
            exit 1
          fi
          if [ "$base" = "$head" ]; then
            echo "No version change; this ships in the next release."
          else
            echo "Release PR: pkgver raised from $base to $head."
          fi
