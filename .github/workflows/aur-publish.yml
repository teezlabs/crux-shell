name: Publish PKGBUILD to AUR

# packaging/PKGBUILD is the source of truth; the AUR repo is a mirror of it.
# Keeping them in sync by hand is what let them drift once already: the AUR
# copy kept an older package() while source= still pulled current code, so an
# installed crux was built by a stale recipe and failed at startup with
# `module "qs.Widgets" is not installed`.

on:
  push:
    branches: [main]
    paths:
      - packaging/PKGBUILD
      - .github/workflows/aur-publish.yml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Arch image so .SRCINFO is regenerated by the real makepkg rather than
    # trusting whatever was committed alongside the PKGBUILD.
    container: archlinux:base-devel

    steps:
      - name: Install tooling
        run: pacman -Sy --noconfirm --needed git openssh

      - uses: actions/checkout@v4

      - name: Configure SSH for the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "::error::AUR_SSH_KEY secret is not set" >&2
            exit 1
          fi
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync PKGBUILD and regenerate .SRCINFO
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/crux-shell-git.git /tmp/aur
          cp packaging/PKGBUILD /tmp/aur/PKGBUILD

          # makepkg refuses to run as root, and the container runs as root.
          useradd -m builder
          chown -R builder /tmp/aur
          su builder -c 'cd /tmp/aur && makepkg --printsrcinfo > .SRCINFO'

          # git then sees a tree owned by someone else
          git config --global --add safe.directory /tmp/aur

      - name: Commit and push
        run: |
          set -euo pipefail
          cd /tmp/aur
          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo "AUR already matches packaging/PKGBUILD — nothing to push."
            exit 0
          fi
          git config user.name "Teez"
          git config user.email "dmedoro13@gmail.com"
          git add PKGBUILD .SRCINFO
          git commit -m "sync PKGBUILD from crux-shell@$(echo "$GITHUB_SHA" | cut -c1-7)"
          git push origin master
          echo "Pushed to the AUR."
